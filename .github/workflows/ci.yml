name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-lint:
    name: format-lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: format-lint

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: tests-${{ matrix.os }}-${{ matrix.python }}

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }} --extra dev

      - name: Run tests
        run: uv run pytest

  registry:
    name: registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: registry

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Validate example registry
        run: |
          uv run hostmark registry validate --registry registry/hosts.example.json
          uv run hostmark registry format --registry registry/hosts.example.json --check

      - name: Validate candidate private registry when present
        run: |
          if [[ -f registry/hosts.json ]]; then
            uv run hostmark registry validate --registry registry/hosts.json
            uv run hostmark registry format --registry registry/hosts.json --check
          fi

      - name: Validate private registry history from pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_has_registry=false
          if git cat-file -e "${BASE_SHA}:registry/hosts.json" 2>/dev/null; then
            base_has_registry=true
          fi

          candidate_has_registry=false
          if [[ -f registry/hosts.json ]]; then
            candidate_has_registry=true
          fi

          if [[ "${base_has_registry}" == true && "${candidate_has_registry}" == false ]]; then
            echo "registry/hosts.json exists at the base SHA and cannot be deleted" >&2
            exit 1
          fi

          if [[ "${base_has_registry}" == true && "${candidate_has_registry}" == true ]]; then
            git show "${BASE_SHA}:registry/hosts.json" > "${RUNNER_TEMP}/hosts.base.json"
            uv run hostmark registry validate \
              --registry registry/hosts.json \
              --against "${RUNNER_TEMP}/hosts.base.json"
          elif [[ "${base_has_registry}" == false && "${candidate_has_registry}" == true ]]; then
            uv run hostmark registry validate --registry registry/hosts.json
          fi

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: package

      - name: Set up Python
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Inspect artifact members and privacy boundary
        run: python scripts/verify_artifacts.py dist

      - name: Install wheel into a clean environment
        run: |
          uv venv "${RUNNER_TEMP}/hostmark-smoke" --python 3.11
          uv pip install --python "${RUNNER_TEMP}/hostmark-smoke/bin/python" dist/*.whl

      - name: Smoke-test installed package and CLI
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/hostmark-smoke/bin/python" -c "import hostmark"
          "${RUNNER_TEMP}/hostmark-smoke/bin/hostmark" --version
          "${RUNNER_TEMP}/hostmark-smoke/bin/python" -m hostmark --version
          "${RUNNER_TEMP}/hostmark-smoke/bin/hostmark"
          "${RUNNER_TEMP}/hostmark-smoke/bin/hostmark" identity --help
          "${RUNNER_TEMP}/hostmark-smoke/bin/hostmark" registry --help
          "${RUNNER_TEMP}/hostmark-smoke/bin/hostmark" check --help
