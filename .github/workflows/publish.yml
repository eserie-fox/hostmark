name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: publish-build

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify release source
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "origin/main is unavailable after full-history checkout" >&2
            exit 1
          fi
          main_tip=$(git rev-parse refs/remotes/origin/main)
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            package_version=$(python -c "import runpy; print(runpy.run_path('src/hostmark/version.py')['__version__'])")
            expected_tag="v${package_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "tag/version mismatch: tag is ${GITHUB_REF_NAME}, expected ${expected_tag}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${release_commit}" "${main_tip}"; then
              echo "tag commit ${release_commit} is not reachable from origin/main" >&2
              exit 1
            fi
          elif [[ "${release_commit}" != "${main_tip}" ]]; then
            echo "workflow_dispatch must run at the current origin/main tip ${main_tip}" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Inspect artifact members and privacy boundary
        run: python scripts/verify_artifacts.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish-to-foxpi:
    name: Publish to foxpi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: foxpi-publish
      url: https://foxpi.foxenz.com/publisher/prod/+simple/hostmark/
    permissions:
      contents: read
    env:
      UV_PUBLISH_USERNAME: ${{ secrets.FOXPI_PUBLISH_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.FOXPI_PUBLISH_PASSWORD }}
      UV_INDEX_FOXPI_USERNAME: ${{ secrets.FOXPI_PUBLISH_USERNAME }}
      UV_INDEX_FOXPI_PASSWORD: ${{ secrets.FOXPI_PUBLISH_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: publish-upload

      - name: Download exact build artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to foxpi
        run: uv publish --index foxpi
