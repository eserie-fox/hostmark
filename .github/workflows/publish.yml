name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: publish-build

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version=$(PYTHONPATH=src python -c "from hostmark.version import __version__; print(__version__)")
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag/version mismatch: tag is ${GITHUB_REF_NAME}, expected ${expected_tag}" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Inspect artifact members and privacy boundary
        run: python scripts/verify_artifacts.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish-to-foxpi:
    name: Publish to foxpi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: foxpi-publish
      url: https://foxpi.foxenz.com/publisher/prod/+simple/hostmark/
    permissions:
      contents: read
    env:
      UV_PUBLISH_USERNAME: ${{ secrets.FOXPI_PUBLISH_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.FOXPI_PUBLISH_PASSWORD }}
      UV_INDEX_FOXPI_USERNAME: ${{ secrets.FOXPI_PUBLISH_USERNAME }}
      UV_INDEX_FOXPI_PASSWORD: ${{ secrets.FOXPI_PUBLISH_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: publish-upload

      - name: Download exact build artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to foxpi
        run: uv publish --index foxpi
