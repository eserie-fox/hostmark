[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hostmark"
dynamic = ["version"]
description = "Cross-platform host identity and canonical hostname registry CLI backed by Git."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "eserie-fox"},
]
dependencies = [
    "GitPython>=3.1.59,<4",
    "pydantic>=2.7",
    "typer>=0.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/eserie-fox/hostmark"
Repository = "https://github.com/eserie-fox/hostmark"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
hostmark = "hostmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["hostmark*"]

[tool.setuptools.package-data]
hostmark = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "hostmark.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.uv.index]]
name = "foxpi"
url = "https://foxpi.foxenz.com/publisher/prod/+simple/"
publish-url = "https://foxpi.foxenz.com/publisher/prod/"
explicit = true
authenticate = "always"
